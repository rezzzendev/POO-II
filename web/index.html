<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Gestão de Eventos</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ddd; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 1rem; }
    form label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.2rem; }
    button { cursor: pointer; }
    .erro { color: #b00020; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>Gestão de Eventos</h1>

  <table>
    <thead>
      <tr><th>Título</th><th>Modalidade</th><th>Início</th><th>Fim</th><th>Status</th><th></th></tr>
    </thead>
    <tbody id="linhas"></tbody>
  </table>

  <h2>Novo evento</h2>
  <form id="formNovoEvento">
    <label>Título <input name="titulo" required></label>
    <label>Modalidade
      <select name="modalidade">
        <option>PRESENCIAL</option>
        <option>ONLINE</option>
        <option>HIBRIDO</option>
      </select>
    </label>
    <label>Descrição <input name="descricao"></label>
    <label>Início <input name="inicio" type="datetime-local" required></label>
    <label>Fim <input name="fim" type="datetime-local" required></label>
    <button type="submit">Criar</button>
  </form>

  <p id="mensagem" class="erro"></p>

  <script>
    const API = "http://localhost:8080/eventos";

    async function carregarEventos() {
      const mensagem = document.getElementById("mensagem");
      try {
        const resposta = await fetch(API);
        const eventos = await resposta.json();

        const linhas = document.getElementById("linhas");
        linhas.innerHTML = "";
        eventos.forEach(evento => {
          const linha = document.createElement("tr");
          linha.innerHTML = `
            <td>${evento.titulo}</td>
            <td>${evento.modalidade}</td>
            <td>${evento.inicio}</td>
            <td>${evento.fim}</td>
            <td>${evento.status}</td>
            <td><button type="button">Remover</button></td>
          `;
          linha.querySelector("button").addEventListener("click", () => removerEvento(evento.id));
          linhas.appendChild(linha);
        });
      } catch (erro) {
        mensagem.textContent = "Sem conexão com a API: " + erro.message;
      }
    }

    async function removerEvento(id) {
      await fetch(`${API}/${id}`, { method: "DELETE" });
      carregarEventos();
    }

    document.getElementById("formNovoEvento").addEventListener("submit", async (submissao) => {
      submissao.preventDefault();
      const mensagem = document.getElementById("mensagem");
      mensagem.textContent = "";

      const dados = new FormData(submissao.target);
      const corpo = {
        titulo: dados.get("titulo"),
        descricao: dados.get("descricao"),
        modalidade: dados.get("modalidade"),
        inicio: dados.get("inicio"),
        fim: dados.get("fim")
      };

      const resposta = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(corpo)
      });

      if (!resposta.ok) {
        const erro = await resposta.json();
        mensagem.textContent = erro.erro;
        return;
      }

      submissao.target.reset();
      carregarEventos();
    });

    carregarEventos();
  </script>
</body>
</html>
